# 在 Nginx 的 http 上下文中加载；应用前核对实际监听端口和代理配置。
upstream yzboard_http_entry {
    server 127.0.0.1:7001;
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

upstream yzboard_http_worker {
    server 127.0.0.1:7002;
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# 普通 HTTP 清除逐跳连接头，升级请求继续保留 WebSocket 握手。
map $http_upgrade $yzboard_keepalive_connection {
    default upgrade;
    '' '';
}

# 外层普通 HTTP：proxy_pass http://yzboard_http_entry;
# proxy_http_version 1.1;
# proxy_set_header Upgrade $http_upgrade;
# proxy_set_header Connection $yzboard_keepalive_connection;
#
# 内层 location /：proxy_pass http://yzboard_http_worker;
# proxy_http_version 1.1;
# proxy_set_header Connection "";
#
# /ws 继续转发原 WebSocket 服务和升级头；不要把 Upgrade 请求转给 HTTP 工作进程。

# 在 Nginx 的 http 上下文中加载；应用前核对实际监听端口和代理配置。
upstream yzboard_http_entry {
    server 127.0.0.1:7001;
    keepalive 32;
}

upstream yzboard_http_worker {
    server 127.0.0.1:7002;
    keepalive 32;
}

# 普通 HTTP 清除逐跳连接头，升级请求继续保留 WebSocket 握手。
map $http_upgrade $yzboard_keepalive_connection {
    default upgrade;
    '' '';
}
